---
- name: 'Install Stage 0 host dependencies'
  ansible.builtin.apt:
    name:
      - 'awscli'
    state: present
    update_cache: true
  become: true

- name: 'Create Stage 0 application directory'
  ansible.builtin.file:
    group: 'root'
    mode: '0750'
    owner: 'root'
    path: '{{ stage0_app_dir }}'
    state: directory
  become: true

- name: 'Create Stage 0 runtime directory'
  ansible.builtin.file:
    group: 'root'
    mode: '0700'
    owner: 'root'
    path: '{{ stage0_runtime_dir }}'
    state: directory
  become: true

- name: 'Install Parameter Store runtime renderer'
  ansible.builtin.template:
    dest: '/usr/local/sbin/api-observatory-stage0-render-env'
    group: 'root'
    mode: '0700'
    owner: 'root'
    src: 'render-stage0-env.sh.j2'
  become: true

- name: 'Install Stage 0 PostgreSQL backup command'
  ansible.builtin.template:
    dest: '/usr/local/sbin/api-observatory-stage0-backup-postgres'
    group: 'root'
    mode: '0700'
    owner: 'root'
    src: 'backup-stage0-postgres.sh.j2'
  become: true

- name: 'Install Stage 0 PostgreSQL disposable restore command'
  ansible.builtin.template:
    dest: '/usr/local/sbin/api-observatory-stage0-restore-postgres'
    group: 'root'
    mode: '0700'
    owner: 'root'
    src: 'restore-stage0-postgres.sh.j2'
  become: true
