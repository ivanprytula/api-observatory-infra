---
# Static inventory for api-observatory.
# The instance ID and SSM transfer bucket are supplied explicitly by the
# approved operator workflow; no SSH inventory is required.

all:
  children:

    aws_dev:
      hosts:
        api-observatory-ec2:
          ansible_host: '<EC2_INSTANCE_ID>'
          ansible_connection: amazon.aws.aws_ssm
          cloud_provider: aws
