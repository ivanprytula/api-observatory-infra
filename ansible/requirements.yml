---
# Install Galaxy collections before running any playbook:
#   ansible-galaxy collection install -r requirements.yml
collections:
  - name: 'ansible.posix'
    version: '>=1.5.0'
  - name: 'community.docker'
    # docker_compose_v2 was added in community.docker 3.6.0.
    version: '>=3.6.0'
  - name: 'community.general'
    version: '>=9.0.0'
  - name: 'amazon.aws'
    version: '>=8.0.0'
