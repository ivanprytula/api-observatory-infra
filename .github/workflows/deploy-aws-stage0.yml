name: Deploy AWS Stage 0 desired state

on:
  workflow_dispatch:
    inputs:
      promotion_target:
        description: Promotion lane to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stage
          - prod-like
      environment_name:
        description: Concrete deployment target identifier
        required: true
        default: aws-dev
        type: string
  repository_dispatch:
    types: [app-release-published]

permissions:
  checks: read
  contents: write
  id-token: write

concurrency:
  group: aws-dev-stage0-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      vars.AWS_CD_ENABLED == 'true' && vars.AWS_ECR_REGISTRY != '' &&
      vars.AWS_INFRA_DEPLOY_ROLE_ARN != '' && vars.AWS_REGION != '' &&
      vars.AWS_EC2_INSTANCE_ID_DEV != ''
    environment: aws-dev
    env:
      PROMOTION_TARGET: ${{ github.event.inputs.promotion_target || github.event.client_payload.promotion_target || 'dev' }}
      TARGET_ENVIRONMENT_NAME: ${{ github.event.inputs.environment_name || github.event.client_payload.environment_name || 'aws-dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python tooling
        run: uv sync --frozen

      - name: Require a CI-green main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "AWS Stage 0 deployment accepts only the main branch." >&2
            exit 1
          }
          checks=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")
          result=$(jq -r '[.check_runs[] | select(.name == "Merge gate")][0].conclusion // "missing"' <<< "$checks")
          [[ "$result" == "success" ]] || {
            echo "Infra CI check 'Merge gate' is ${result}." >&2
            exit 1
          }

      - name: Validate promotion target
        run: |
          set -euo pipefail
          [[ "$PROMOTION_TARGET" == "dev" ]] || {
            echo "Only the dev promotion lane is active at the moment." >&2
            exit 1
          }
          [[ "$TARGET_ENVIRONMENT_NAME" == "aws-dev" ]] || {
            echo "Only the aws-dev environment target is active at the moment." >&2
            exit 1
          }

      - name: Promote published application release into the lock file
        if: github.event_name == 'repository_dispatch'
        env:
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_COMMIT_SHA: ${{ github.event.client_payload.source_commit_sha }}
          SOURCE_TREE_SHA: ${{ github.event.client_payload.source_tree_sha }}
          RELEASE_IMAGES: ${{ toJson(github.event.client_payload.images) }}
        run: |
          set -euo pipefail
          metadata_path="${RUNNER_TEMP}/release-metadata.json"
          jq -n \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_commit_sha "$SOURCE_COMMIT_SHA" \
            --arg source_tree_sha "$SOURCE_TREE_SHA" \
            --argjson images "$RELEASE_IMAGES" \
            '{
              schema_version: 1,
              source_repository: $source_repository,
              source_commit_sha: $source_commit_sha,
              source_tree_sha: $source_tree_sha,
              images: $images
            }' \
            > "$metadata_path"
          uv run python scripts/promote_stage0_images.py "$metadata_path" --lock "environments/${TARGET_ENVIRONMENT_NAME}/images.lock.json"

      - name: Commit updated image lock
        if: github.event_name == 'repository_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "environments/${TARGET_ENVIRONMENT_NAME}/images.lock.json"
          if ! git diff --cached --quiet; then
            git commit -m "chore: promote app release ${{ github.event.client_payload.source_tree_sha }}"
            git push
          fi

      - id: app-ref
        name: Resolve locked application commit
        shell: bash
        run: |
          set -euo pipefail
          source_commit_sha=$(jq -r .source_commit_sha "environments/${TARGET_ENVIRONMENT_NAME}/images.lock.json")
          [[ "$source_commit_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_commit_sha" != "0000000000000000000000000000000000000000" ]]
          echo "ref=$source_commit_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ivanprytula/api-observatory
          path: .app-release
          ref: ${{ steps.app-ref.outputs.ref }}
      - run: uv run python scripts/validate_stage0_contract.py --app-root .app-release
      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: api-observatory-infra-deploy
      - name: Verify selected ECR digests and deploy desired state
        env:
          REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID_DEV }}
        run: |
          set -euo pipefail
          tree_sha=$(jq -r .source_tree_sha "environments/${TARGET_ENVIRONMENT_NAME}/images.lock.json")
          enabled_profiles=$(jq -r '.enabled_profiles | join(",")' "environments/${TARGET_ENVIRONMENT_NAME}/images.lock.json")
          deployment_env=$({
            jq -r --arg registry "$REGISTRY" --arg sha "$tree_sha" \
              '.images | to_entries[] |
               "\(.key|ascii_upcase)_IMAGE=\($registry)/\(.value.repository)@\(.value.digest)",
               "SERVICE_VERSION=tree-\($sha)"' \
              "environments/${TARGET_ENVIRONMENT_NAME}/images.lock.json" | awk '!seen[$0]++'
            printf 'ENABLED_PROFILES=%s\n' "$enabled_profiles"
          } | base64 -w 0)
          for service in ingestor inference dashboard; do
            repo=$(jq -r ".images.${service}.repository" "environments/${TARGET_ENVIRONMENT_NAME}/images.lock.json")
            digest=$(jq -r ".images.${service}.digest" "environments/${TARGET_ENVIRONMENT_NAME}/images.lock.json")
            aws ecr describe-images \
              --repository-name "$repo" \
              --image-ids imageDigest="$digest" \
              --query 'imageDetails[0].imageTags' \
              --output text | grep -qx "tree-${tree_sha}"
          done
          compose=$(base64 -w 0 deployment/aws-stage0/docker-compose.yml)
          prometheus=$(base64 -w 0 deployment/aws-stage0/prometheus.yml)
          rollout=$(base64 -w 0 deployment/aws-stage0/rollout.sh)
          remote_commands=$(jq -cn \
            --arg deployment_env "$deployment_env" \
            --arg compose "$compose" \
            --arg prometheus "$prometheus" \
            --arg rollout "$rollout" \
            '{commands: [
              "install -d -m 0700 /opt/api-observatory-stage0/.runtime",
              "cd /opt/api-observatory-stage0",
              "test ! -f .runtime/deployment.env || cp .runtime/deployment.env .runtime/deployment.env.previous",
              "echo \($deployment_env) | base64 -d > .runtime/deployment.env",
              "chmod 0600 .runtime/deployment.env",
              "echo \($compose) | base64 -d > docker-compose.yml",
              "echo \($prometheus) | base64 -d > prometheus.yml",
              "echo \($rollout) | base64 -d > rollout.sh",
              "chmod 0700 rollout.sh",
              "/usr/local/sbin/api-observatory-stage0-render-env",
              "./rollout.sh"
            ]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$remote_commands" \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"
