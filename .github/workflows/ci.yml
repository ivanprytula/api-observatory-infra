name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [[ -n "$base" && "$base" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=2 origin "$base" "$head" >/dev/null 2>&1 || true
            changed_files=$(git diff --name-only "$base" "$head")
          else
            changed_files=$(git diff-tree --no-commit-id --name-only -r "$head")
          fi
          echo "$changed_files"
          workflows_regex='^\.github/workflows/ci\.yml'
          infra_paths_regex='^(terraform/|ansible/|scripts/|tests/'
          infra_paths_regex+='|pyproject.toml|uv.lock|\.python-version|Justfile)'
          if echo "$changed_files" | grep -Eq "$infra_paths_regex" \
              || echo "$changed_files" | grep -Eq "$workflows_regex"; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed_files" | grep -Eq '^(docs/|README\.md|CONTRIBUTING\.md)' \
              || echo "$changed_files" | grep -Eq "$workflows_regex"; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  workflow-quality:
    name: Workflow and Secret Checks
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@e7ee33fbf5aa8c9f9ee1145137f3e52e25d6a35b # v0.1.3 (upstream actionlint v1.7.12)

      - name: Reject mutable GitHub Action references
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          mutable_refs=$(grep -nE 'uses:\s*[^#]+@(v[0-9]+|latest|main|master|develop)\b' "${workflow_files[@]}" || true)
          mutable_docker_refs=$(grep -nE 'uses:\s*docker://' "${workflow_files[@]}" | grep -v '@sha256:' || true)
          if [[ -n "${mutable_refs}" || -n "${mutable_docker_refs}" ]]; then
            echo "Mutable action reference detected."
            echo "${mutable_refs}"
            echo "${mutable_docker_refs}"
            exit 1
          fi

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.0"

  ruff:
    name: Python Style
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python tooling
        run: uv sync --frozen

      - name: Lint and format Python scripts
        run: |
          uv run ruff check scripts
          uv run ruff format --check scripts

      - name: Test MVP platform contract
        run: uv run python -m unittest discover -s tests -v

  terraform-fmt:
    name: Terraform Format
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python tooling
        run: uv sync --frozen

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: "~> 1.10"

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform/

  terraform-validate:
    name: Terraform Validate
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: "~> 1.10"

      - name: Validate all environments
        run: |
          for dir in terraform/environments/*/; do
            echo "::group::Validating ${dir}"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done


  tflint:
    name: TFLint
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: terraform-linters/setup-tflint@115085cc23c5f5eeebad58ba418ec14e88c7a431 # v6.0.0
        with:
          tflint_version: v0.63.1

      - name: Init TFLint plugins
        run: tflint --init --config .tflint.hcl

      - name: Run TFLint (all environments)
        run: |
          for dir in terraform/environments/*/; do
            echo "::group::Linting ${dir}"
            tflint --config "$(pwd)/.tflint.hcl" --chdir "$dir"
            echo "::endgroup::"
          done

  checkov:
    name: Checkov Security Scan
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12
        with:
          directory: terraform/
          quiet: true
          compact: true
          # Skip list MUST stay in sync with .pre-commit-config.yaml and the
          # justifications in TERRAFORM_CHECKS.md (each ID = one documented row).
          skip_check: CKV2_AWS_62,CKV_AWS_21,CKV_AWS_130,CKV_AWS_136,CKV_AWS_144,CKV_AWS_145

  yaml-lint:
    name: YAML Lint
    needs: [changes]
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python tooling
        run: uv sync --frozen

      - name: Run yamllint
        run: uv run yamllint -c .yamllint.yml .

  docs-command-references:
    name: Docs Command References
    needs: [changes]
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python tooling
        run: uv sync --frozen

      - name: Check active documentation commands
        run: uv run python scripts/check_docs_commands.py

  shellcheck:
    name: ShellCheck
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        run: shellcheck --severity=warning scripts/*.sh

  merge-gate:
    name: Merge gate
    runs-on: ubuntu-latest
    if: always() && (needs.changes.outputs.infra == 'true' || needs.changes.outputs.docs == 'true')
    needs:
      - changes
      - workflow-quality
      - ruff
      - terraform-fmt
      - terraform-validate
      - tflint
      - checkov
      - yaml-lint
      - docs-command-references
      - shellcheck
    steps:
      - name: Require every infrastructure CI job
        env:
          WORKFLOW_RESULT: ${{ needs.workflow-quality.result }}
          RUFF_RESULT: ${{ needs.ruff.result }}
          TERRAFORM_FMT_RESULT: ${{ needs.terraform-fmt.result }}
          TERRAFORM_VALIDATE_RESULT: ${{ needs.terraform-validate.result }}
          TFLINT_RESULT: ${{ needs.tflint.result }}
          CHECKOV_RESULT: ${{ needs.checkov.result }}
          YAML_RESULT: ${{ needs.yaml-lint.result }}
          DOCS_COMMAND_REFERENCES_RESULT: ${{ needs.docs-command-references.result }}
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
        run: |
          set -euo pipefail
          for result in \
            "$WORKFLOW_RESULT" "$RUFF_RESULT" "$TERRAFORM_FMT_RESULT" \
            "$TERRAFORM_VALIDATE_RESULT" "$TFLINT_RESULT" "$CHECKOV_RESULT" \
            "$YAML_RESULT" "$DOCS_COMMAND_REFERENCES_RESULT" \
            "$SHELLCHECK_RESULT"; do
            [[ "$result" == "success" || "$result" == "skipped" ]] || exit 1
          done
