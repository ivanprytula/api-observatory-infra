repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: destroyed-symlinks
      - id: fix-byte-order-marker
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix, --config=pyproject.toml]
        files: ^scripts/.*\.py$
      - id: ruff-format
        files: ^scripts/.*\.py$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: gitleaks secrets scan

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: [--config, .markdownlint-cli2.jsonc, --fix]
        files: \.(md|markdown)$
        exclude: ^(\.venv/|\.remember/|node_modules/|vendor/|\.claude/|\.kilo/|\.codex/|\.cursor/|\.windsurf/|\.github/copilot/)

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.15.0
    hooks:
      - id: markdown-link-check
        args: [--config, .markdown-link-check.json]
        files: \.(md|markdown)$

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.11
    hooks:
      - id: checkov
        entry: checkov
        pass_filenames: false
        args:
          - --directory
          - terraform/
          - --framework
          - terraform
          - --quiet
          - --compact
          - --skip-check
          - CKV2_AWS_62,CKV_AWS_21,CKV_AWS_130,CKV_AWS_136,CKV_AWS_144,CKV_AWS_145

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        entry: ansible-lint --project-dir ansible
        args: [--offline]
        files: ansible/
        pass_filenames: false

  - repo: local
    hooks:
      - id: docs-command-references
        name: docs command/reference check
        entry: uv run python scripts/check_docs_commands.py
        language: system
        pass_filenames: false
        files: ^(README\.md|CONTRIBUTING\.md|Justfile|docs/)

ci:
  autofix_commit_msg: "chore: auto-fix pre-commit hooks"
  autofix_prs: true
