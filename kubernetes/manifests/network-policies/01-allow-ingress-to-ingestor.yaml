apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-ingestor
  namespace: api-observatory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingestor
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-edge
