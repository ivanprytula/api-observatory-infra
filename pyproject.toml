[project]
name = "api-observatory-infra"
version = "0.1.0"
description = "AWS-first Infrastructure-as-Code for the API Observatory MVP"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "shellcheck-py>=0.11.0.1",
    "yamllint==1.38.0",
    "pre-commit>=4.6.1",
]

[tool.ruff]
line-length = 88
target-version = "py314"
